# Fixes inverted headphone-jack detection on the ES8336 codec used by the
# UNOWHY Y13G011S4EI (and likely other Gemini Lake / sof-essx8336 machines
# whose motherboard is not present in the kernel's DMI quirk table).
#
# Without this, "quirk mask" is 0x0 at boot (dmesg | grep quirk) and the
# driver believes headphones are permanently plugged in, muting the
# internal speaker even when nothing is connected.
#
# Bit 6 = SOF_ES8336_JD_INVERTED (jack-detect polarity inverted)
options snd_soc_sof_es8336 quirk=64
